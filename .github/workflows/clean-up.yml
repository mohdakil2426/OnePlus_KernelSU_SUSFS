name: Cleanup caches and runs

on:
  workflow_dispatch:
    inputs:
      cleanup_type:
        type: choice
        description: Cleanup target
        required: true
        default: cache_only
        options:
          - cache_only
          - runs_only
          - full_cleanup
          - analyze_only

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze / clean caches
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.cleanup_type }}
        run: |
          set -euo pipefail
          echo "Mode: $MODE"
          echo "Repo: $GITHUB_REPOSITORY"

          if [[ "$MODE" == "analyze_only" || "$MODE" == "cache_only" || "$MODE" == "full_cleanup" ]]; then
            echo "::group::Caches"
            gh cache list --limit 100 || true
            if [[ "$MODE" != "analyze_only" ]]; then
              gh cache list --json id --jq '.[].id' | while read -r id; do
                [ -n "$id" ] && gh cache delete "$id" || true
              done
            fi
            echo "::endgroup::"
          fi

          if [[ "$MODE" == "runs_only" || "$MODE" == "full_cleanup" ]]; then
            echo "::group::Old workflow runs (info only)"
            gh run list --limit 20 || true
            echo "Manual deletion of runs is optional; use GitHub UI if needed."
            echo "::endgroup::"
          fi
