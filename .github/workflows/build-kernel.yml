name: Build OP8 Series Kernel (SM8250)

# Runs on branch op8series-sm8250-ksu-susfs only.
# - push: reads configs/build-request.json (used when branch is not default;
#   workflow_dispatch from API requires workflow on default branch)
# - workflow_dispatch: UI dropdowns (works once this branch is default, or workflow is on default)

permissions:
  contents: write

on:
  push:
    branches:
      - op8series-sm8250-ksu-susfs
    paths:
      - configs/build-request.json
      - scripts/**
      - .github/workflows/build-kernel.yml
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'OnePlusOSS sm8250 kernel branch'
        required: true
        type: choice
        default: 'oneplus/sm8250_u_14.0.0_op8t'
        options:
          - oneplus/SM8250_Q_10.0
          - oneplus/SM8250_R_11.0
          - oneplus/SM8250_R_11.0_9R
          - oneplus/sm8250_s_12.1
          - oneplus/sm8250_t_13.0.0_op8
          - oneplus/sm8250_t_13.0.0_op9r
          - oneplus/sm8250_t_13.1_op8
          - oneplus/sm8250_t_13.1_op9r
          - oneplus/sm8250_u_14.0.0_op8t
          - oneplus/sm8250_u_14.0.0_op9r
      build_mode:
        description: 'STOCK = non-root | KSUN = KernelSU-Next | KSUN_SUSFS = KSUN + SUSFS'
        required: true
        type: choice
        default: 'STOCK'
        options:
          - STOCK
          - KSUN
          - KSUN_SUSFS
      device_profile:
        description: 'AnyKernel device check codenames'
        required: true
        type: choice
        default: 'ALL_OP8_SERIES'
        options:
          - ALL_OP8_SERIES
          - OP8
          - OP8Pro
          - OP8T
          - OP9R
      defconfig:
        description: 'Kernel defconfig'
        required: true
        type: choice
        default: 'vendor/kona-perf_defconfig'
        options:
          - vendor/kona-perf_defconfig
          - vendor/kona_defconfig
      ksun_ref:
        description: 'KernelSU-Next git ref (branch/tag). Empty = next'
        required: false
        type: string
        default: 'next'
      susfs_ref:
        description: 'SUSFS branch/tag (only for KSUN_SUSFS). Empty = kernel-4.19'
        required: false
        type: string
        default: 'kernel-4.19'
      make_release:
        description: 'Create GitHub Release with artifacts'
        required: true
        type: boolean
        default: false
      debug:
        description: 'Upload build log on failure'
        required: false
        type: boolean
        default: true

env:
  KERNEL_SOURCE: https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git

jobs:
  resolve:
    name: Resolve build request
    runs-on: ubuntu-latest
    outputs:
      kernel_branch: ${{ steps.r.outputs.kernel_branch }}
      build_mode: ${{ steps.r.outputs.build_mode }}
      device_profile: ${{ steps.r.outputs.device_profile }}
      defconfig: ${{ steps.r.outputs.defconfig }}
      ksun_ref: ${{ steps.r.outputs.ksun_ref }}
      susfs_ref: ${{ steps.r.outputs.susfs_ref }}
      make_release: ${{ steps.r.outputs.make_release }}
      debug: ${{ steps.r.outputs.debug }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve inputs
        id: r
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kernel_branch=${{ inputs.kernel_branch }}" >> "$GITHUB_OUTPUT"
            echo "build_mode=${{ inputs.build_mode }}" >> "$GITHUB_OUTPUT"
            echo "device_profile=${{ inputs.device_profile }}" >> "$GITHUB_OUTPUT"
            echo "defconfig=${{ inputs.defconfig }}" >> "$GITHUB_OUTPUT"
            echo "ksun_ref=${{ inputs.ksun_ref || 'next' }}" >> "$GITHUB_OUTPUT"
            echo "susfs_ref=${{ inputs.susfs_ref || 'kernel-4.19' }}" >> "$GITHUB_OUTPUT"
            echo "make_release=${{ inputs.make_release }}" >> "$GITHUB_OUTPUT"
            echo "debug=${{ inputs.debug }}" >> "$GITHUB_OUTPUT"
          else
            # push: configs/build-request.json on this branch
            jq -r '
              "kernel_branch=\(.kernel_branch)",
              "build_mode=\(.build_mode)",
              "device_profile=\(.device_profile)",
              "defconfig=\(.defconfig)",
              "ksun_ref=\(.ksun_ref // "next")",
              "susfs_ref=\(.susfs_ref // "kernel-4.19")",
              "make_release=\(.make_release // false)",
              "debug=\(.debug // true)"
            ' configs/build-request.json >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved:"
          cat "$GITHUB_OUTPUT"

  build:
    name: ${{ needs.resolve.outputs.build_mode }} · ${{ needs.resolve.outputs.kernel_branch }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Disk cleanup
        uses: ./.github/actions/disk-cleanup

      - name: Install packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git curl wget bc bison build-essential flex \
            libssl-dev libelf-dev python3 cpio zip unzip rsync \
            libncurses-dev jq

      - name: Setup Clang (ZyC 14)
        run: |
          set -euo pipefail
          mkdir -p toolchains/clang
          curl -fsSL \
            "https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20250704-release/Clang-14.0.6-20250704.tar.gz" \
            | tar -xzf - -C toolchains/clang
          if [ ! -x toolchains/clang/bin/clang ]; then
            nested=$(find toolchains/clang -maxdepth 3 -type f -name clang | head -1)
            if [ -n "$nested" ]; then
              root=$(dirname "$(dirname "$nested")")
              echo "$root/bin" >> "$GITHUB_PATH"
            fi
          else
            echo "$GITHUB_WORKSPACE/toolchains/clang/bin" >> "$GITHUB_PATH"
          fi
          clang --version | head -2

      - name: Setup AOSP GCC (aarch64 + arm)
        run: |
          set -euo pipefail
          git clone --depth=1 -b android12L-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchains/gcc64
          git clone --depth=1 -b android12L-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            toolchains/gcc32
          echo "$GITHUB_WORKSPACE/toolchains/gcc64/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchains/gcc32/bin" >> "$GITHUB_PATH"

      - name: Normalize script permissions
        run: chmod +x scripts/*.sh

      - name: Build kernel
        id: build
        env:
          KERNEL_SOURCE: ${{ env.KERNEL_SOURCE }}
          KERNEL_BRANCH: ${{ needs.resolve.outputs.kernel_branch }}
          BUILD_MODE: ${{ needs.resolve.outputs.build_mode }}
          DEFCONFIG: ${{ needs.resolve.outputs.defconfig }}
          DEVICE_PROFILE: ${{ needs.resolve.outputs.device_profile }}
          KSUN_REF: ${{ needs.resolve.outputs.ksun_ref }}
          SUSFS_REF: ${{ needs.resolve.outputs.susfs_ref }}
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts
          WORK_DIR: ${{ github.workspace }}/work
        run: bash scripts/build.sh

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.zip_name || 'op8series-kernel' }}
          path: |
            artifacts/*.zip
            artifacts/Image
            artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure() && needs.resolve.outputs.debug == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: |
            artifacts/build.log
            work/**/*.rej
          if-no-files-found: ignore
          retention-days: 14

      - name: Create release
        if: success() && needs.resolve.outputs.make_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: op8series-${{ github.run_number }}
          name: OP8 Series ${{ needs.resolve.outputs.build_mode }} — ${{ needs.resolve.outputs.kernel_branch }}
          body: |
            ## OnePlus 8 Series Kernel (SM8250)

            | Field | Value |
            |-------|--------|
            | Branch (git) | `op8series-sm8250-ksu-susfs` |
            | Source | `OnePlusOSS/android_kernel_oneplus_sm8250` |
            | Kernel branch | `${{ needs.resolve.outputs.kernel_branch }}` |
            | Mode | `${{ needs.resolve.outputs.build_mode }}` |
            | Device profile | `${{ needs.resolve.outputs.device_profile }}` |
            | Defconfig | `${{ needs.resolve.outputs.defconfig }}` |
            | Kernel | `${{ steps.build.outputs.kernel_version }}` |
          files: |
            artifacts/*.zip
            artifacts/build-info.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
