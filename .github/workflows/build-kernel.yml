name: Build OP8 Series Kernel (SM8250)

# Branch: op8series-sm8250-ksu-susfs
# - push on configs/build-request.json / scripts / this workflow → matrix from JSON
# - workflow_dispatch → select source preset (HELLBOY017 primary)

permissions:
  contents: write

on:
  push:
    branches:
      - op8series-sm8250-ksu-susfs
    paths:
      - configs/build-request.json
      - configs/sources.json
      - scripts/**
      - .github/workflows/build-kernel.yml
  workflow_dispatch:
    inputs:
      source_preset:
        description: 'Kernel source (HELLBOY017 = primary stock CLO)'
        required: true
        type: choice
        default: 'HELLBOY017'
        options:
          - HELLBOY017
          - LINEAGEOS
          - ONEPLUS_OSS
      build_mode:
        description: 'STOCK = no root | KSUN | KSUN_SUSFS'
        required: true
        type: choice
        default: 'STOCK'
        options:
          - STOCK
          - KSUN
          - KSUN_SUSFS
      device_profile:
        description: 'AnyKernel device codenames'
        required: true
        type: choice
        default: 'ALL_OP8_SERIES'
        options:
          - ALL_OP8_SERIES
          - OP8
          - OP8Pro
          - OP8T
          - OP9R
      kernel_branch_override:
        description: 'Optional branch override (empty = preset default)'
        required: false
        type: string
        default: ''
      defconfig_override:
        description: 'Optional defconfig override (empty = preset default)'
        required: false
        type: string
        default: ''
      ksun_ref:
        description: 'KernelSU-Next ref (KSUN modes)'
        required: false
        type: string
        default: 'next'
      susfs_ref:
        description: 'SUSFS ref (KSUN_SUSFS)'
        required: false
        type: string
        default: 'kernel-4.19'
      make_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: false
      debug:
        description: 'Upload logs on failure'
        required: false
        type: boolean
        default: true

jobs:
  resolve:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.r.outputs.matrix }}
      build_mode: ${{ steps.r.outputs.build_mode }}
      device_profile: ${{ steps.r.outputs.device_profile }}
      ksun_ref: ${{ steps.r.outputs.ksun_ref }}
      susfs_ref: ${{ steps.r.outputs.susfs_ref }}
      make_release: ${{ steps.r.outputs.make_release }}
      debug: ${{ steps.r.outputs.debug }}
    steps:
      - uses: actions/checkout@v4

      - name: Build job matrix
        id: r
        shell: bash
        run: |
          set -euo pipefail
          SOURCES=configs/sources.json

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.build_mode }}"
            DEV="${{ inputs.device_profile }}"
            KSUN="${{ inputs.ksun_ref || 'next' }}"
            SUSFS="${{ inputs.susfs_ref || 'kernel-4.19' }}"
            REL="${{ inputs.make_release }}"
            DBG="${{ inputs.debug }}"
            PRESET="${{ inputs.source_preset }}"
            BR_OVR="${{ inputs.kernel_branch_override }}"
            DC_OVR="${{ inputs.defconfig_override }}"
            PRESETS=$(jq -cn --arg p "$PRESET" '[$p]')
          else
            MODE=$(jq -r '.build_mode // "STOCK"' configs/build-request.json)
            DEV=$(jq -r '.device_profile // "ALL_OP8_SERIES"' configs/build-request.json)
            KSUN=$(jq -r '.ksun_ref // "next"' configs/build-request.json)
            SUSFS=$(jq -r '.susfs_ref // "kernel-4.19"' configs/build-request.json)
            REL=$(jq -r '.make_release // false' configs/build-request.json)
            DBG=$(jq -r '.debug // true' configs/build-request.json)
            BR_OVR=$(jq -r '.kernel_branch_override // ""' configs/build-request.json)
            DC_OVR=$(jq -r '.defconfig_override // ""' configs/build-request.json)
            PRESETS=$(jq -c '.source_presets // ["HELLBOY017"]' configs/build-request.json)
          fi

          echo "build_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "device_profile=$DEV" >> "$GITHUB_OUTPUT"
          echo "ksun_ref=$KSUN" >> "$GITHUB_OUTPUT"
          echo "susfs_ref=$SUSFS" >> "$GITHUB_OUTPUT"
          echo "make_release=$REL" >> "$GITHUB_OUTPUT"
          echo "debug=$DBG" >> "$GITHUB_OUTPUT"

          # Expand presets → matrix include
          MATRIX=$(jq -c \
            --argjson presets "$PRESETS" \
            --arg br_ovr "${BR_OVR:-}" \
            --arg dc_ovr "${DC_OVR:-}" \
            '
            . as $S |
            [ $presets[] as $p |
              if ($S | has($p) | not) then error("Unknown source preset: \($p)") else . end |
              $S[$p] |
              {
                preset: $p,
                kernel_source: .kernel_source,
                kernel_branch: (if $br_ovr != "" then $br_ovr else .kernel_branch end),
                defconfig: (if $dc_ovr != "" then $dc_ovr else .defconfig end),
                run_oplus_stubs: (.run_oplus_stubs // true | tostring),
                disable_proprietary_oplus_configs: (.disable_proprietary_oplus_configs // false | tostring)
              }
            ] | {include: .}
            ' "$SOURCES")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix:"
          echo "$MATRIX" | jq .

  build:
    name: ${{ needs.resolve.outputs.build_mode }} · ${{ matrix.preset }} · ${{ matrix.kernel_branch }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Disk cleanup
        uses: ./.github/actions/disk-cleanup

      - name: Install packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git curl wget bc bison build-essential flex \
            libssl-dev libelf-dev python3 cpio zip unzip rsync \
            libncurses-dev jq

      - name: Setup Clang (ZyC 14)
        run: |
          set -euo pipefail
          mkdir -p toolchains/clang
          curl -fsSL \
            "https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20250704-release/Clang-14.0.6-20250704.tar.gz" \
            | tar -xzf - -C toolchains/clang
          if [ -x toolchains/clang/bin/clang ]; then
            echo "$GITHUB_WORKSPACE/toolchains/clang/bin" >> "$GITHUB_PATH"
          else
            nested=$(find toolchains/clang -maxdepth 3 -type f -name clang | head -1 || true)
            if [ -n "$nested" ]; then
              echo "$(dirname "$(dirname "$nested")")/bin" >> "$GITHUB_PATH"
            fi
          fi
          clang --version || true

      - name: Setup AOSP GCC
        run: |
          set -euo pipefail
          git clone --depth=1 -b android12L-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchains/gcc64
          git clone --depth=1 -b android12L-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            toolchains/gcc32
          echo "$GITHUB_WORKSPACE/toolchains/gcc64/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchains/gcc32/bin" >> "$GITHUB_PATH"

      - name: Normalize scripts
        run: chmod +x scripts/*.sh

      - name: Build kernel
        id: build
        env:
          KERNEL_SOURCE: ${{ matrix.kernel_source }}
          KERNEL_BRANCH: ${{ matrix.kernel_branch }}
          BUILD_MODE: ${{ needs.resolve.outputs.build_mode }}
          DEFCONFIG: ${{ matrix.defconfig }}
          DEVICE_PROFILE: ${{ needs.resolve.outputs.device_profile }}
          KSUN_REF: ${{ needs.resolve.outputs.ksun_ref }}
          SUSFS_REF: ${{ needs.resolve.outputs.susfs_ref }}
          RUN_OPLUS_STUBS: ${{ matrix.run_oplus_stubs }}
          DISABLE_PROPRIETARY_OPLUS_CONFIGS: ${{ matrix.disable_proprietary_oplus_configs }}
          SOURCE_PRESET: ${{ matrix.preset }}
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts
          WORK_DIR: ${{ github.workspace }}/work
        run: bash scripts/build.sh

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}-${{ needs.resolve.outputs.build_mode }}-${{ steps.build.outputs.zip_name || 'kernel' }}
          path: |
            artifacts/*.zip
            artifacts/Image
            artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure logs
        if: failure() && needs.resolve.outputs.debug == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fail-${{ matrix.preset }}-${{ github.run_id }}
          path: |
            artifacts/build.log
            work/**/*.rej
          if-no-files-found: ignore
          retention-days: 14

      - name: Create release
        if: success() && needs.resolve.outputs.make_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: op8series-${{ matrix.preset }}-${{ github.run_number }}
          name: OP8 ${{ needs.resolve.outputs.build_mode }} · ${{ matrix.preset }} · ${{ matrix.kernel_branch }}
          body: |
            | Field | Value |
            |-------|--------|
            | Preset | `${{ matrix.preset }}` |
            | Source | `${{ matrix.kernel_source }}` |
            | Branch | `${{ matrix.kernel_branch }}` |
            | Mode | `${{ needs.resolve.outputs.build_mode }}` |
            | Defconfig | `${{ matrix.defconfig }}` |
            | Kernel | `${{ steps.build.outputs.kernel_version }}` |
          files: |
            artifacts/*.zip
            artifacts/build-info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
