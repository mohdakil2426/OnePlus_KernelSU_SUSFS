name: Build OP8 Series Kernel (SM8250)

# Branch: op8series-sm8250-ksu-susfs (selectable clean upstream sources)
# Trigger: workflow_dispatch ONLY — same as main's build-kernel-release.yml
#   (never push / schedule / PR automatic builds)
# - main is reference-only; do not develop OP8 work there
# ccache: author pattern from main (reference) — bucket "ccache-cache"

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Root: STOCK / KernelSU-Next / optional SUSFS'
        required: true
        type: choice
        default: 'KSUN_SUSFS'
        options:
          - STOCK
          - KSUN
          - KSUN_SUSFS
      device_profile:
        description: 'Device: verified OnePlus 8 only'
        required: true
        type: choice
        default: 'OP8'
        options:
          - OP8
      source_preset:
        description: 'Source: OP8-compatible kernel preset'
        required: true
        type: choice
        default: 'ONEPLUSOSS_OP8_OOS13_1'
        options:
          - HELLBOY017
          - PPAJDA
          - ONEPLUSOSS_OP8_OOS13_1
      kernel_branch:
        description: 'Source: supported branch override (empty = preset default)'
        required: false
        type: string
        default: ''
      clean_build:
        description: 'CI: clean build without ccache'
        type: boolean
        default: true
      make_release:
        description: 'Release: create draft after success'
        required: true
        type: boolean
        default: false
      debug:
        description: 'CI: upload build log on failure'
        required: false
        type: boolean
        default: true

jobs:
  resolve:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.r.outputs.matrix }}
      build_mode: ${{ steps.r.outputs.build_mode }}
      device_profile: ${{ steps.r.outputs.device_profile }}
      ksun_ref: ${{ steps.r.outputs.ksun_ref }}
      susfs_ref: ${{ steps.r.outputs.susfs_ref }}
      clean_build: ${{ steps.r.outputs.clean_build }}
      make_release: ${{ steps.r.outputs.make_release }}
      debug: ${{ steps.r.outputs.debug }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate builder
        run: bash tests/run-static-tests.sh

      - name: Build job matrix
        id: r
        shell: bash
        run: |
          set -euo pipefail
          SOURCES=configs/sources.json
          REQUEST=configs/build-request.json

          PRESET="${{ inputs.source_preset }}"
          if ! jq -e --arg p "$PRESET" 'has($p)' "$SOURCES" >/dev/null; then
            echo "::error::Unknown source_preset=$PRESET"
            exit 1
          fi

          MODE="${{ inputs.build_mode }}"
          DEV="${{ inputs.device_profile }}"
          KSUN=$(jq -er '.ksun_ref' "$REQUEST")
          SUSFS=$(jq -er '.susfs_ref' "$REQUEST")
          [[ "$KSUN" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Configured KernelSU-Next revision is not immutable"
            exit 1
          }
          [[ "$SUSFS" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Configured SUSFS revision is not immutable"
            exit 1
          }
          CLEAN="${{ inputs.clean_build }}"
          REL="${{ inputs.make_release }}"
          DBG="${{ inputs.debug }}"
          KBRANCH="${{ inputs.kernel_branch }}"
          if ! jq -e --arg p "$PRESET" --arg d "$DEV" \
            '.[$p].supported_devices | index($d)' "$SOURCES" >/dev/null; then
            echo "::error::source_preset=$PRESET does not support device_profile=$DEV"
            exit 1
          fi
          if [[ -z "$KBRANCH" ]]; then
            KBRANCH=$(jq -er --arg p "$PRESET" '.[$p].kernel_branch' "$SOURCES")
          fi
          if ! jq -e --arg p "$PRESET" --arg b "$KBRANCH" '.[$p].allowed_branches | index($b)' "$SOURCES" >/dev/null; then
            echo "::error::Unsupported branch '$KBRANCH' for source_preset=$PRESET"
            exit 1
          fi

          {
            echo "build_mode=$MODE"
            echo "device_profile=$DEV"
            echo "ksun_ref=$KSUN"
            echo "susfs_ref=$SUSFS"
            echo "clean_build=$CLEAN"
            echo "make_release=$REL"
            echo "debug=$DBG"
          } >> "$GITHUB_OUTPUT"

          # Manual dispatch always resolves to one selected source and branch.
          MATRIX=$(jq -c \
            --arg p "$PRESET" \
            --arg kbranch "$KBRANCH" \
            '
            .[$p] as $S |
            {
              include: [{
                preset: $p,
                kernel_source: $S.kernel_source,
                kernel_branch: $kbranch,
                companion_source: ($S.companion_source // ""),
                companion_branch: ($S.companion_branch // ""),
                toolchain: ($S.toolchain // "zyc-clang-14"),
                source_patch_set: ($S.source_patch_set // "none"),
                defconfig: $S.defconfig
              }]
            }
            ' "$SOURCES")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix ($PRESET · branch $KBRANCH):"
          echo "$MATRIX" | jq .
          echo "clean_build=$CLEAN"

  # Same as main: download custom ccache once, share to matrix jobs (avoids raw.githubusercontent throttle)
  prepare_ccache:
    name: Prepare ccache binary (download once)
    runs-on: ubuntu-latest
    steps:
      - name: Download custom ccache once
        if: ${{ inputs.clean_build != true }}
        run: |
          set -uo pipefail
          echo "::group::Download ccache"
          url="https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/ccache/ccache-x86-64"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl -LfsS --connect-timeout 30 --max-time 120 -H "User-Agent: Mozilla/5.0" "$url" -o ccache && [ -s ccache ]; then
              ok=1; break
            fi
            echo "attempt $attempt failed (GitHub raw 504/throttle); backing off..."
            sleep $(( attempt * 5 + RANDOM % 6 ))
          done
          if [ "$ok" = 1 ]; then
            echo "✅ downloaded ccache once for all matrix jobs"
          else
            echo "::warning::custom ccache download failed; matrix jobs will fall back to the apt ccache"
            rm -f ccache
          fi
          echo "::endgroup::"

      - name: Upload ccache artifact
        if: ${{ inputs.clean_build != true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ccache-binary
          path: ccache
          retention-days: 1
          if-no-files-found: warn

  build:
    name: ${{ needs.resolve.outputs.build_mode }} · ${{ matrix.preset }} · ${{ matrix.kernel_branch }}
    needs: [resolve, prepare_ccache]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Disk cleanup
        uses: ./.github/actions/disk-cleanup

      - name: Install packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git curl wget bc bison build-essential flex \
            libssl-dev libelf-dev python3 cpio zip unzip rsync \
            libncurses-dev jq ccache aria2 zstd

      - name: Get prebuilt ccache (downloaded once by prepare_ccache)
        if: ${{ needs.resolve.outputs.clean_build != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ccache-binary
          path: ccache-dl
        continue-on-error: true

      - name: Install ccache (ECS by cctv18, shared via artifact)
        if: ${{ needs.resolve.outputs.clean_build != 'true' }}
        run: |
          set -uo pipefail
          echo "::group::Install ccache"
          if [ -s ccache-dl/ccache ]; then
            sudo cp -f ccache-dl/ccache /usr/bin/ccache
            sudo chmod +x /usr/bin/ccache
            echo "✅ installed custom ccache from shared artifact"
          else
            echo "::warning::shared ccache artifact unavailable; using apt ccache"
          fi
          rm -rf ccache-dl
          echo "[DEBUG] Ccache version : $(ccache --version | head -1)"
          echo "::endgroup::"

      - name: Setup selected Clang
        run: |
          set -euo pipefail
          TOOLCHAIN="${{ matrix.toolchain }}"
          case "$TOOLCHAIN" in
            android-clang-r399163b)
              CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.1.0_r0.25/clang-r399163b.tar.gz"
              EXPECTED_VERSION="11.0.5"
              ;;
            zyc-clang-14)
              CLANG_URL="https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20250704-release/Clang-14.0.6-20250704.tar.gz"
              EXPECTED_VERSION="14.0.6"
              ;;
            *)
              echo "::error::Unknown toolchain profile: $TOOLCHAIN"
              exit 1
              ;;
          esac

          mkdir -p toolchains/clang
          curl -fL --retry 3 --connect-timeout 30 --max-time 900 "$CLANG_URL" \
            | tar -xzf - -C toolchains/clang
          if [ -x toolchains/clang/bin/clang ]; then
            CLANG_BIN_DIR="$GITHUB_WORKSPACE/toolchains/clang/bin"
          else
            nested=$(find toolchains/clang -maxdepth 3 -type f -name clang -print -quit)
            [ -n "$nested" ] || { echo "::error::clang binary not found"; exit 1; }
            CLANG_BIN_DIR="$(dirname "$nested")"
          fi

          export PATH="$CLANG_BIN_DIR:$PATH"
          echo "$CLANG_BIN_DIR" >> "$GITHUB_PATH"
          CLANG_OUTPUT=$(clang --version)
          echo "$CLANG_OUTPUT"
          grep -Fq "clang version $EXPECTED_VERSION" <<< "$CLANG_OUTPUT" || {
            echo "::error::Expected Clang $EXPECTED_VERSION for $TOOLCHAIN"
            exit 1
          }
          CLANG_VER=$(grep -oE 'clang version [0-9]+\.[0-9]+\.[0-9]+' <<< "$CLANG_OUTPUT" | head -1 | awk '{print $3}')
          {
            echo "TOOLCHAIN_PROFILE=$TOOLCHAIN"
            echo "CLANG_VERSION_SHORT=${CLANG_VER%%.*}"
            echo "CLANG_VERSION=$CLANG_VER"
          } >> "$GITHUB_ENV"

      - name: Setup selected GNU cross tools
        run: |
          set -euo pipefail
          if [[ "${{ matrix.toolchain }}" == "android-clang-r399163b" ]]; then
            mkdir -p toolchains/gas
            curl -fL --retry 3 --connect-timeout 30 --max-time 300 \
              "https://android.googlesource.com/platform/prebuilts/gas/linux-x86/+archive/592150fc8ae9f48f2e73f390961f32ca6f5f6a9f.tar.gz" \
              | tar -xzf - -C toolchains/gas
            chmod +x toolchains/gas/aarch64-linux-gnu-* toolchains/gas/arm-linux-gnueabi-*
            echo "$GITHUB_WORKSPACE/toolchains/gas" >> "$GITHUB_PATH"
            test -x toolchains/gas/aarch64-linux-gnu-as
            test -x toolchains/gas/arm-linux-gnueabi-as
          else
            git clone --depth=1 -b android12L-release \
              https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
              toolchains/gcc64
            git clone --depth=1 -b android12L-release \
              https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
              toolchains/gcc32
            echo "$GITHUB_WORKSPACE/toolchains/gcc64/bin" >> "$GITHUB_PATH"
            echo "$GITHUB_WORKSPACE/toolchains/gcc32/bin" >> "$GITHUB_PATH"
          fi

      - name: ♻️ Configure ccache (bounded)
        if: ${{ needs.resolve.outputs.clean_build != 'true' }}
        run: |
          echo "::group::Configure ccache environment"
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            CACHE_DIR="${{ github.workspace }}/.ccache"
            CCACHE_LOG="${{ github.workspace }}/ccache.log"
            mkdir -p "$CACHE_DIR"

            SETTINGS=(
              "CCACHE_DIR=$CACHE_DIR"
              "CCACHE_MAXSIZE=12G"
              "CCACHE_COMPILERCHECK=content"
              "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
              "CCACHE_NOHASHDIR=true"
              "CCACHE_IGNOREOPTIONS=--sysroot*"
              "CCACHE_COMPRESSION=true"
              "CCACHE_COMPRESSION_LEVEL=3"
              "CCACHE_DIRECT=true"
              "CCACHE_FILE_CLONE=true"
              "CCACHE_INODE_CACHE=true"
              "CCACHE_IS_KERNEL_COMPILING=true"
              "CCACHE_UMASK=002"
              "CCACHE_LOGFILE=${CCACHE_LOG}"
              "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale"
            )

            for setting in "${SETTINGS[@]}"; do
              export "${setting?}"
              echo "$setting" >> "$GITHUB_ENV"
            done

            if ccache --help 2>&1 | grep -q 'depend_mode'; then
              export CCACHE_DEPEND=true
              echo "CCACHE_DEPEND=true" >> "$GITHUB_ENV"
            fi

            echo "✅ ccache configured successfully"
            echo "Current ccache configuration:"
            ccache -p
          else
            echo "ccache not found, skipping configuration."
          fi
          echo "::endgroup::"

      - name: Set ccache key
        if: ${{ needs.resolve.outputs.clean_build != 'true' }}
        run: |
          set -euo pipefail
          # Author-style key: MODE-v1-PRESET-BRANCH-clangN (slashes → _)
          BR_SAFE=$(echo "${{ matrix.kernel_branch }}" | tr '/:' '__')
          MODE="${{ needs.resolve.outputs.build_mode }}"
          PRESET="${{ matrix.preset }}"
          CL="${CLANG_VERSION_SHORT:-14}"
          KEY="${MODE}-v1-${PRESET}-${BR_SAFE}-clang${CL}"
          echo "CCACHE_CACHE_KEY=$KEY" >> "$GITHUB_ENV"
          echo "Cache key: $KEY"

      - name: Restore ccache cache
        id: restore-ccache-cache
        if: ${{ needs.resolve.outputs.clean_build != 'true' }}
        uses: ./.github/actions/cache/restore
        with:
          cache_path: ${{ github.workspace }}/.ccache
          cache_key: ${{ env.CCACHE_CACHE_KEY }}
          cache_bucket: "ccache-cache"
          debug: ${{ needs.resolve.outputs.debug == 'true' }}
          restore_keys: |
            ${{ needs.resolve.outputs.build_mode }}-v1-${{ matrix.preset }}-

      - name: Check and Prepare Caches
        if: ${{ needs.resolve.outputs.clean_build != 'true' }}
        shell: bash
        run: |
          echo "::group::Check ccache"
          set -euo pipefail

          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

          echo "Current ccache configuration:"
          ccache -p || true

          if [ -d "$CCACHE_DIR" ] && find "$CCACHE_DIR" -maxdepth 2 -type f -print -quit 2>/dev/null | grep -q .; then
            echo "✅ Restored cache found"
            echo ""
            echo "Pre-build cache statistics:"
            ccache -s | head -n 20

            echo "Updating atime to achieve cache eviction"
            find "${CCACHE_DIR}" -type f -exec touch -t "$(date -d "1 day ago" +%Y%m%d%H%M)" {} +
          else
            echo "⚠️ No existing cache - building from scratch"
            echo "Cache will be populated for future builds"
          fi

          ccache -z
          rm -f "$CCACHE_DIR/ccache.log" 2>/dev/null || true
          echo "::endgroup::"

      - name: Normalize scripts
        run: chmod +x scripts/*.sh

      - name: Build kernel
        id: build
        env:
          KERNEL_SOURCE: ${{ matrix.kernel_source }}
          KERNEL_BRANCH: ${{ matrix.kernel_branch }}
          COMPANION_SOURCE: ${{ matrix.companion_source }}
          COMPANION_BRANCH: ${{ matrix.companion_branch }}
          TOOLCHAIN_PROFILE: ${{ matrix.toolchain }}
          SOURCE_PATCH_SET: ${{ matrix.source_patch_set }}
          BUILD_MODE: ${{ needs.resolve.outputs.build_mode }}
          DEFCONFIG: ${{ matrix.defconfig }}
          DEVICE_PROFILE: ${{ needs.resolve.outputs.device_profile }}
          KSUN_REF: ${{ needs.resolve.outputs.ksun_ref }}
          SUSFS_REF: ${{ needs.resolve.outputs.susfs_ref }}
          SOURCE_PRESET: ${{ matrix.preset }}
          CLEAN_BUILD: ${{ needs.resolve.outputs.clean_build }}
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts
          WORK_DIR: ${{ github.workspace }}/work
        run: bash scripts/build.sh

      - name: Publish build summary
        if: success()
        run: cat artifacts/build-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 📊 ccache Post-Build Statistics
        id: ccache_stats
        if: ${{ success() && needs.resolve.outputs.clean_build != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::ccache final statistics"

          export CCACHE_DIR="${{ github.workspace }}/.ccache"

          echo "Clear Temporary cache files..."
          ccache -c || true

          echo "Perform ccache eviction!"
          # 0.5 days = 12 Hrs. Delete cache unused in 12 hrs (author pattern).
          find "$CCACHE_DIR" -type f -mtime +0.5 -delete 2>/dev/null || true
          find "$CCACHE_DIR" -type d -empty -delete 2>/dev/null || true

          if [ -n "${CCACHE_LOGFILE:-}" ] && [ -f "${CCACHE_LOGFILE}" ]; then
            cp "${CCACHE_LOGFILE}" "$CCACHE_DIR/" || true
          fi

          STATS="$(ccache -s)"
          echo "$STATS"

          CACHEABLE=$(echo "$STATS" | awk '/Cacheable calls:/ { match($0, /[0-9]+/); print substr($0, RSTART, RLENGTH) }' | head -n1)
          HITS=$(echo "$STATS" | awk '/^[[:space:]]*Hits:/ { match($0, /[0-9]+/); print substr($0, RSTART, RLENGTH) }' | head -n1)
          DIRECT=$(echo "$STATS" | awk '/Direct:/ { match($0, /[0-9]+/); print substr($0, RSTART, RLENGTH) }' | head -n1)

          if [ "${CACHEABLE:-0}" -gt 0 ] 2>/dev/null; then
            HIT_RATE=$(awk -v h="${HITS:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (h/c)*100}')
            DIRECT_RATE=$(awk -v d="${DIRECT:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (d/c)*100}')
          else
            HIT_RATE="0.0"
            DIRECT_RATE="0.0"
          fi

          echo "hit_rate=${HIT_RATE}%" >> "$GITHUB_OUTPUT"
          echo "direct_rate=${DIRECT_RATE}%" >> "$GITHUB_OUTPUT"

          echo "::endgroup::"

          {
            echo "## 📊 ccache Statistics"
            echo
            echo '```'
            ccache -s --verbose 2>/dev/null || ccache -s
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save ccache cache
        if: ${{ success() && needs.resolve.outputs.clean_build != 'true' }}
        uses: ./.github/actions/cache/save
        with:
          cache_path: ${{ github.workspace }}/.ccache
          cache_key: ${{ env.CCACHE_CACHE_KEY }}
          cache_bucket: "ccache-cache"
          debug: ${{ needs.resolve.outputs.debug == 'true' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          compression_level: 6

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: |
            artifacts/*.zip
            artifacts/*.zip.sha256
            artifacts/Image
            artifacts/build-info.txt
            artifacts/build-summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure logs
        if: failure() && needs.resolve.outputs.debug == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fail-${{ matrix.preset }}-${{ github.run_id }}
          path: |
            artifacts/build.log
            work/**/*.rej
          if-no-files-found: ignore
          retention-days: 14

      - name: Create release
        if: success() && needs.resolve.outputs.make_release == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: op8series-${{ matrix.preset }}-${{ github.run_number }}
          name: OP8 ${{ needs.resolve.outputs.build_mode }} · ${{ matrix.preset }} · ${{ matrix.kernel_branch }}
          draft: true
          body_path: artifacts/build-summary.md
          files: |
            artifacts/*.zip
            artifacts/*.zip.sha256
            artifacts/build-info.txt
            artifacts/build-summary.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
