name: Bug report
description: Report a build or runtime issue for OP8 series SM8250 kernels
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - OnePlus 8
        - OnePlus 8 Pro
        - OnePlus 8T
        - OnePlus 9R
        - Other / unknown
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Kernel branch built
      placeholder: oneplus/sm8250_u_14.0.0_op8t
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Build mode
      options:
        - STOCK
        - KSUN
        - KSUN_SUSFS
    validations:
      required: true
  - type: textarea
    id: rom
    attributes:
      label: ROM / OOS version
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: What happened / steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (dmesg, build.log excerpt)
